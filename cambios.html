<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Deathmatch - Cambios</title>

    <style>
        /* Carga de la fuente personalizada local */
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('Minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* Fondo optimizado para evitar tirones de rendimiento */
            background: #1a0000;
            position: relative;
        }

        /* Capa de degradado estática optimizada para fluidez total */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #660000 0%, #1a0000 40%, #000000 80%);
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior / Encabezado */
        header {
            width: 100%;
            padding: 4px 30px;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Logo 1 (Arriba a la izquierda) */
        .logo-1 {
            height: 100px;
            width: auto;
            display: block;
            object-fit: contain;
            margin-top: 30px;
            margin-bottom: 4px;
        }

        /* Contenedor de los botones superior */
        .nav-botones {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 40px;
            flex-wrap: nowrap;
        }

        .btn-nav {
            display: block;
            height: 38px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            will-change: transform, filter;
            transform: translateZ(0);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), filter 0.25s ease;
        }

        /* Efecto de brillo y escala al pasar el cursor sobre los botones */
        .btn-nav:hover {
            transform: scale(1.06) translateZ(0);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        /* Contenedor principal */
        main {
            flex: 1;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 40px 180px 140px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Imagen de cabecera de la sección Cambios con brillo y pulso */
        .img-seccion {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            object-fit: contain;
            will-change: transform, filter;
            transform: translateZ(0);
            animation: pulsoSeccion 3s ease-in-out infinite alternate;
        }

        @keyframes pulsoSeccion {
            0% {
                transform: scale(1) translateZ(0);
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
            }
            100% {
                transform: scale(1.04) translateZ(0);
                filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.8));
            }
        }

        /* Panel contenedor del mensaje de cambios */
        .panel-cambios {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 60px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            will-change: transform;
            transform: translateZ(0);
        }

        /* Mensaje central */
        .mensaje-cambios {
            font-size: 1.25rem;
            color: #e0e0e0;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Logo 2 (Abajo a la derecha) */
        .logo-2 {
            position: fixed;
            bottom: 20px;
            right: 25px;
            height: 40px;
            width: auto;
            object-fit: contain;
            z-index: 10;
        }

        /* ========================================================= */
        /*   ADAPTACIÓN PARA DISPOSITIVOS MÓVILES (SMARTPHONES)       */
        /* ========================================================= */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
                flex-direction: column;
                gap: 12px;
            }

            .logo-1 {
                height: 60px;
                margin-top: 5px;
                margin-bottom: 5px;
            }

            .nav-botones {
                margin-left: 0;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .btn-nav {
                height: 28px;
            }

            main {
                padding: 25px 20px 100px 20px;
            }

            .img-seccion {
                max-width: 220px;
                margin-bottom: 25px;
            }

            .panel-cambios {
                padding: 35px 20px;
            }

            .mensaje-cambios {
                font-size: 1rem;
            }

            .logo-2 {
                bottom: 12px;
                right: 12px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Encabezado superior -->
    <header>
        <a href="index.html"><img src="https://i.imgur.com/eSClUmH.png" alt="Minecraft Deathmatch Logo" class="logo-1"></a>
        
        <nav class="nav-botones">
            <a href="participantes.html"><img src="https://i.imgur.com/BmuM8tb.png" alt="Participantes" class="btn-nav"></a>
            <a href="cambios.html"><img src="https://i.imgur.com/PrP3vfI.png" alt="Cambios" class="btn-nav"></a>
            <a href="descargas.html"><img src="https://i.imgur.com/wQSTFtZ.png" alt="Descargas" class="btn-nav"></a>
            <a href="contribuidores.html"><img src="https://i.imgur.com/kHKAbia.png" alt="Contribuidores" class="btn-nav"></a>
        </nav>
    </header>

    <!-- Área de contenido principal -->
    <main>
        <!-- Imagen de cabecera de la sección Cambios -->
        <img src="https://i.imgur.com/10sVKlQ.png" alt="Cambios" class="img-seccion">

        <!-- Panel central de información -->
        <div class="panel-cambios">
            <p class="mensaje-cambios">No hay cambios aun // El servidor no inicio</p>
        </div>
    </main>

    <!-- Logo Maci Hq Studios -->
    <img src="https://i.imgur.com/tPcG0ge.png" alt="Maci HQ Studios Logo" class="logo-2">

</body>
</html>
