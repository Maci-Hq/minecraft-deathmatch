<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Deathmatch</title>

    <style>
        /* Carga de la fuente personalizada local */
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('Minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a0000;
            position: relative;
        }

        /* Capa base: Fondo Rojo (Sección superior) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #660000 0%, #1a0000 40%, #000000 80%);
            z-index: -6;
            pointer-events: none;
        }

        /* Capa intermedia 1: Fondo Morado (Primera historia) */
        .fondo-morado-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #330033 0%, #11001a 40%, #000000 80%);
            z-index: -5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        /* Capa intermedia 2: Fondo Celeste-Negro (Segunda historia) */
        .fondo-celeste-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #003366 0%, #001a33 40%, #000000 80%);
            z-index: -4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        /* Capa 3: Fondo Blanco-Negro (Final de la historia) */
        .fondo-blanco-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #404040 0%, #1a1a1a 40%, #000000 80%);
            z-index: -3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        /* Capa 4: Fondo Azul-Celeste con Estrellas Dinámicas Reales (Sección Especies) */
        .fondo-especies-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #001133 0%, #002244 40%, #00081a 80%);
            z-index: -2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
            overflow: hidden;
        }

        /* Capa 5: Fondo Rojo Oscuro - Rojo con Estrellas Dinámicas Rojas (Sección Mortales) */
        .fondo-mortales-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #4d0000 0%, #800000 40%, #260000 80%);
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
            overflow: hidden;
        }

        /* Capa 6: Fondo Diagonal Morado -> Magenta -> Azul (Sección Universos) */
        .fondo-universos-capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #330033 0%, #660066 35%, #9900cc 65%, #003366 100%);
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
            overflow: hidden;
        }

        .estrella-universos {
            position: absolute;
            background-color: #ff00ff;
            border-radius: 50%;
            animation: parpadeoEstrellaUniversos var(--duracion) ease-in-out infinite alternate;
            box-shadow: 0 0 6px #ff77ff;
        }

        @keyframes parpadeoEstrellaUniversos {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 12px #ff99ff;
            }
        }

        /* Contenedores de estrellas animadas individuales */
        .estrella {
            position: absolute;
            background-color: #00ffff;
            border-radius: 50%;
            animation: parpadeoEstrella var(--duracion) ease-in-out infinite alternate;
            box-shadow: 0 0 6px #00bfff;
        }

        @keyframes parpadeoEstrella {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 12px #33ccff;
            }
        }

        .estrella-roja {
            position: absolute;
            background-color: #ff3333;
            border-radius: 50%;
            animation: parpadeoEstrellaRoja var(--duracion) ease-in-out infinite alternate;
            box-shadow: 0 0 6px #ff0000;
        }

        @keyframes parpadeoEstrellaRoja {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 12px #ff4d4d;
            }
        }

        /* Barra superior / Encabezado */
        header {
            width: 100%;
            padding: 4px 30px;
            background-color: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Logo 1 (Arriba a la izquierda) */
        .logo-1 {
            height: 100px;
            width: auto;
            display: block;
            object-fit: contain;
            margin-top: 30px;
            margin-bottom: 4px;
        }

        /* Contenedor de los botones superior */
        .nav-botones {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 40px;
            flex-wrap: nowrap;
        }

        .btn-nav {
            display: block;
            height: 38px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            will-change: transform, filter;
            transform: translateZ(0);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), filter 0.25s ease;
        }

        .btn-nav:hover {
            transform: scale(1.06) translateZ(0);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }

        /* Contenedor principal */
        main {
            flex: 1;
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 40px 180px 140px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Imagen de Bienvenida (tamaño original) */
        .img-bienvenido {
            max-width: 480px;
            width: 90%;
            height: auto;
            margin-bottom: 45px;
            object-fit: contain;
            animation: pulsoDorado 3s ease-in-out infinite alternate;
        }

        /* Imágenes de título de las secciones (Tamaño reducido a 320px) */
        .img-titulo-historia, .img-titulo-amenaza, .img-titulo-final, .img-titulo-especies {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            margin-top: 70px;
            object-fit: contain;
            animation: pulsoDorado 3s ease-in-out infinite alternate;
        }

        /* Imagen de Inmortales con Brillo Celeste */
        .img-titulo-inmortales {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            margin-top: 15px;
            object-fit: contain;
            animation: pulsoCelesteInmortales 3s ease-in-out infinite alternate;
        }

        /* Imagen de Universos con Brillo Morado */
        .img-titulo-universos {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            margin-top: 70px;
            object-fit: contain;
            animation: pulsoMoradoUniversos 3s ease-in-out infinite alternate;
        }

        @keyframes pulsoMoradoUniversos {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(176, 0, 255, 0.4));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(176, 0, 255, 0.9));
            }
        }

        /* Imagen de Mortales con Brillo Rojo */
        .img-titulo-mortales {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            margin-top: 60px;
            object-fit: contain;
            animation: pulsoRojoMortales 3s ease-in-out infinite alternate;
        }

        @keyframes pulsoDorado {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.85));
            }
        }

        @keyframes pulsoCelesteInmortales {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.4));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 22px rgba(0, 204, 255, 0.9));
            }
        }

        @keyframes pulsoRojoMortales {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.4));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.9));
            }
        }

        /* Bloque de texto principal y de historia */
        .bloque-texto {
            width: 100%;
            text-align: left;
            line-height: 1.9;
            font-size: 1.25rem;
            color: #e0e0e0;
        }

        /* Estilo base para cada palabra animada normal */
        .palabra-animada {
            opacity: 0;
            display: inline-block;
            transform: translateY(12px);
            animation: palabraAparece 0.35s ease-out forwards;
        }

        @keyframes palabraAparece {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brillo rojo para la bienvenida */
        .palabra-chispa-roja {
            animation: palabraAparece 0.35s ease-out forwards, brilloRojoEfecto 1.5s ease-out forwards;
        }

        @keyframes brilloRojoEfecto {
            0% {
                filter: drop-shadow(0 0 18px #ff0000) drop-shadow(0 0 8px #ff3333) brightness(1.8);
                color: #ffffff;
            }
            30% {
                filter: drop-shadow(0 0 14px #ff0000) brightness(1.5);
                color: #ff8888;
            }
            70% {
                filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.7)) brightness(1.2);
                color: #ff4d4d;
            }
            100% {
                filter: drop-shadow(0 0 0px transparent) brightness(1);
                color: #ff4d4d;
            }
        }

        /* Brillo morado para la primera historia */
        .palabra-chispa-morada {
            animation: palabraAparece 0.35s ease-out forwards, brilloMoradoEfecto 1.5s ease-out forwards;
        }

        @keyframes brilloMoradoEfecto {
            0% {
                filter: drop-shadow(0 0 18px #b000ff) drop-shadow(0 0 8px #cc44ff) brightness(1.8);
                color: #ffffff;
            }
            30% {
                filter: drop-shadow(0 0 14px #b000ff) brightness(1.5);
                color: #e088ff;
            }
            70% {
                filter: drop-shadow(0 0 8px rgba(176, 0, 255, 0.7)) brightness(1.2);
                color: #d14dff;
            }
            100% {
                filter: drop-shadow(0 0 0px transparent) brightness(1);
                color: #d14dff;
            }
        }

        /* Brillo celeste para la nueva historia */
        .palabra-chispa-celeste {
            animation: palabraAparece 0.35s ease-out forwards, brilloCelesteEfecto 1.5s ease-out forwards;
        }

        @keyframes brilloCelesteEfecto {
            0% {
                filter: drop-shadow(0 0 18px #00ffff) drop-shadow(0 0 8px #33ccff) brightness(1.8);
                color: #ffffff;
            }
            30% {
                filter: drop-shadow(0 0 14px #00ffff) brightness(1.5);
                color: #88ffff;
            }
            70% {
                filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.7)) brightness(1.2);
                color: #4dd2ff;
            }
            100% {
                filter: drop-shadow(0 0 0px transparent) brightness(1);
                color: #4dd2ff;
            }
        }

        /* Brillo blanco REFORZADO */
        .palabra-chispa-blanca {
            animation: palabraAparece 0.35s ease-out forwards, brilloBlancoIntenso 1.5s ease-out forwards;
        }

        @keyframes brilloBlancoIntenso {
            0% {
                filter: drop-shadow(0 0 22px #ffffff) drop-shadow(0 0 10px #ffffff) brightness(2.2);
                color: #ffffff;
            }
            40% {
                filter: drop-shadow(0 0 16px #ffffff) brightness(1.8);
                color: #ffffff;
            }
            80% {
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)) brightness(1.4);
                color: #f2f2f2;
            }
            100% {
                filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)) brightness(1.2);
                color: #ffffff;
            }
        }

        /* Efecto especial "ODIO" y "DEATHMATCH" (Glitch en rojo) */
        .palabra-odio-glitch {
            display: inline-block;
            opacity: 0;
            transform: translateY(12px);
            animation: palabraAparece 0.35s ease-out forwards, efectoOdioGlitch 2s ease-in-out infinite alternate;
        }

        @keyframes efectoOdioGlitch {
            0% {
                color: #ff0000;
                filter: drop-shadow(0 0 4px #ff0000) brightness(0.6);
                transform: translateY(0) translate(0, 0);
            }
            20% {
                color: #ff4d4d;
                filter: drop-shadow(0 0 15px #ff0000) brightness(1.8);
                transform: translateY(0) translate(-1px, 1px);
            }
            22% {
                color: #990000;
                filter: drop-shadow(0 0 2px #550000) brightness(0.4);
                transform: translateY(0) translate(2px, -1px);
            }
            40% {
                color: #ff1a1a;
                filter: drop-shadow(0 0 10px #ff0000) brightness(1.2);
                transform: translateY(0) translate(0, 0);
            }
            60% {
                color: #ff6666;
                filter: drop-shadow(0 0 20px #ff0000) brightness(2.0);
                transform: translateY(0) translate(-1px, -1px);
            }
            80% {
                color: #b30000;
                filter: drop-shadow(0 0 5px #ff0000) brightness(0.8);
                transform: translateY(0) translate(1px, 1px);
            }
            100% {
                color: #ff3333;
                filter: drop-shadow(0 0 12px #ff0000) brightness(1.5);
                transform: translateY(0) translate(0, 0);
            }
        }

        /* Efecto rojo para "Quitarles la inmortalidad" */
        .palabra-inmortalidad-roja {
            display: inline-block;
            opacity: 0;
            transform: translateY(12px);
            animation: palabraAparece 0.35s ease-out forwards, brilloRojoEfecto 1.5s ease-out forwards;
        }

        .bloque-texto p {
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .bloque-texto p:last-child {
            margin-bottom: 0;
        }

        .texto-bienvenido strong { color: #ff4d4d; }
        .texto-historia strong { color: #d14dff; }
        .texto-amenaza strong { color: #4dd2ff; }
        .texto-final strong { color: #ffffff; }

        /* Estilo para los contenedores de paneles con imagen lateral */
        .contenedor-inmortales, .contenedor-mortales {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 10px;
        }

        .panel-inmortales {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #00c3ff;
            border-radius: 6px;
            padding: 35px 40px;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.3);
        }

        .img-lateral-inmortales {
            max-width: 320px;
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            filter: drop-shadow(0 0 12px rgba(0, 204, 255, 0.5));
        }

        .panel-mortales {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff3333;
            border-radius: 6px;
            padding: 35px 40px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }

        .img-lateral-mortales {
            max-width: 320px;
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            filter: drop-shadow(0 0 12px rgba(255, 51, 51, 0.5));
        }

        /* Panel negro grande con fondo de espacio (Sección Universos) */
        .panel-universos-grande {
            width: 100%;
            height: 450px;
            background-color: #000000;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, #ffffff 100%, transparent),
                radial-gradient(2px 2px at 25% 70%, #ffffff 100%, transparent),
                radial-gradient(1px 1px at 50% 30%, #ffffff 100%, transparent),
                radial-gradient(2px 2px at 75% 80%, #ffffff 100%, transparent),
                radial-gradient(1.5px 1.5px at 90% 15%, #ffffff 100%, transparent),
                radial-gradient(1px 1px at 40% 90%, #ffffff 100%, transparent);
            background-size: 100% 100%;
            border: 2px solid #ffffff;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Estilos para el mapa interactivo de Universos */
        .universo-mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            z-index: 2;
        }

        .universo-mapa.oculto {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .objeto-universo {
            position: absolute;
            cursor: pointer;
            transform: translate(-50%, -
