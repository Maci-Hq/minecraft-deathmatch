<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Deathmatch - Participantes</title>

    <style>
        /* Carga de la fuente personalizada local */
        @font-face {
            font-family: 'MinecraftCustom';
            src: url('Minecraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MinecraftCustom', monospace, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* Degradado de fondo animado */
            background: linear-gradient(180deg, #660000 0%, #1a0000 35%, #000000 70%);
            background-size: 100% 200%;
            animation: moverDegradado 8s ease infinite alternate;
            position: relative;
        }

        @keyframes moverDegradado {
            0% {
                background-position: top;
            }
            100% {
                background-position: bottom;
            }
        }

        /* Barra superior / Encabezado */
        header {
            width: 100%;
            padding: 4px 30px;
            background-color: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Logo 1 (Arriba a la izquierda) */
        .logo-1 {
            height: 100px;
            width: auto;
            display: block;
            object-fit: contain;
            margin-top: 30px;
            margin-bottom: 4px;
        }

        /* Contenedor de los botones superior */
        .nav-botones {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 40px;
            flex-wrap: nowrap;
        }

        .btn-nav {
            display: block;
            height: 38px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            will-change: transform, filter;
            transform: translateZ(0);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), filter 0.25s ease;
        }

        .btn-nav:hover {
            transform: scale(1.06) translateZ(0);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }

        /* Contenedor principal */
        main {
            flex: 1;
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
            padding: 40px 180px 140px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Imagen de cabecera de la sección (Participantes resaltado) con brillo y pulso */
        .img-seccion {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 45px;
            object-fit: contain;
            animation: pulsoSeccion 3s ease-in-out infinite alternate;
        }

        @keyframes pulsoSeccion {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
            }
            100% {
                transform: scale(1.04);
                filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.8));
            }
        }

        /* Cuadrícula de Participantes (Grid de 5 columnas) */
        .grid-participantes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px 25px;
            width: 100%;
            justify-items: center;
            margin-bottom: 40px;
        }

        /* Tarjeta individual de cada participante */
        .card-participante {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        /* Marco cuadrado para la imagen */
        .cuadro-img {
            width: 130px;
            height: 130px;
            border: 2px solid #ffffff;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
        }

        .cuadro-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Estilo para los cuadros en progreso (WIP) */
        .cuadro-wip {
            font-size: 1.5rem;
            color: #777777;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Tooltip al apoyar el cursor en la casilla */
        .tooltip-box {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .card-participante:hover .tooltip-box {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Nombre del participante */
        .nombre-participante {
            font-size: 0.95rem;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* Logo 2 (Abajo a la derecha) */
        .logo-2 {
            position: fixed;
            bottom: 20px;
            right: 25px;
            height: 40px;
            width: auto;
            object-fit: contain;
            z-index: 10;
        }

        /* ========================================================= */
        /*   ADAPTACIÓN PARA DISPOSITIVOS MÓVILES (SMARTPHONES)       */
        /* ========================================================= */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
                flex-direction: column;
                gap: 12px;
            }

            .logo-1 {
                height: 60px;
                margin-top: 5px;
                margin-bottom: 5px;
            }

            .nav-botones {
                margin-left: 0;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .btn-nav {
                height: 28px;
            }

            main {
                padding: 25px 15px 100px 15px;
            }

            .img-seccion {
                max-width: 220px;
                margin-bottom: 25px;
            }

            .grid-participantes {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 15px;
            }

            .cuadro-img {
                width: 100px;
                height: 100px;
            }

            .nombre-participante {
                font-size: 0.85rem;
            }

            .logo-2 {
                bottom: 12px;
                right: 12px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Encabezado superior -->
    <header>
        <a href="index.html"><img src="https://i.imgur.com/eSClUmH.png" alt="Minecraft Deathmatch Logo" class="logo-1"></a>
        
        <nav class="nav-botones">
            <!-- Botón Participantes activo/seleccionado -->
            <a href="participantes.html"><img src="https://i.imgur.com/BmuM8tb.png" alt="Participantes" class="btn-nav"></a>
            <a href="cambios.html"><img src="https://i.imgur.com/PrP3vfI.png" alt="Cambios" class="btn-nav"></a>
            <a href="descargas.html"><img src="https://i.imgur.com/wQSTFtZ.png" alt="Descargas" class="btn-nav"></a>
            <a href="contribuidores.html"><img src="https://i.imgur.com/kHKAbia.png" alt="Contribuidores" class="btn-nav"></a>
        </nav>
    </header>

    <!-- Área de contenido principal -->
    <main>
        <!-- Imagen de cabecera de la sección Participantes -->
        <img src="https://i.imgur.com/S3BFRmm.png" alt="Participantes" class="img-seccion">

        <!-- Cuadrícula de 25 Participantes -->
        <div class="grid-participantes" id="gridParticipantes">
            <!-- Se generará dinámicamente -->
        </div>
    </main>

    <!-- Logo Maci Hq Studios -->
    <img src="https://i.imgur.com/tPcG0ge.png" alt="Maci HQ Studios Logo" class="logo-2">

    <!-- Script para generar los 25 espacios de participantes automáticamente -->
    <script>
        const grid = document.getElementById('gridParticipantes');
        const totalParticipantes = 25;

        /* 
          Configuración para cada participante.
          - Para importar una imagen en el futuro, solo añade aquí su número, nombre, url de imagen y estado ("vivo", "muerto", "test", etc.).
        */
        const participantesConfig = {
            1: { nombre: "Maci_Hq", img: "https://i.imgur.com/O2S1UjA.png", estado: "vivo" },
            2: { nombre: "RamaWM29", img: "https://i.imgur.com/4TQxjxu.png", estado: "vivo" }
        };

        for (let i = 1; i <= totalParticipantes; i++) {
            const card = document.createElement('div');
            card.className = 'card-participante';

            const cuadro = document.createElement('div');
            cuadro.className = 'cuadro-img';

            // Tooltip individual al pasar el cursor
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip-box';
            
            const participante = participantesConfig[i];

            if (participante && participante.img) {
                // Participante con imagen asignada
                const img = document.createElement('img');
                img.src = participante.img;
                img.alt = participante.nombre;
                cuadro.appendChild(img);

                const nombre = document.createElement('span');
                nombre.className = 'nombre-participante';
                nombre.textContent = participante.nombre;

                tooltip.textContent = participante.estado || "vivo";

                card.appendChild(cuadro);
                card.appendChild(tooltip);
                card.appendChild(nombre);
            } else {
                // Casilla vacía / en progreso (WIP) lista para importar imagen en el futuro
                cuadro.classList.add('cuadro-wip');
                cuadro.textContent = i;

                const nombre = document.createElement('span');
                nombre.className = 'nombre-participante';
                nombre.textContent = participante && participante.nombre ? participante.nombre : "Nombre";

                tooltip.textContent = participante && participante.estado ? participante.estado : "test";

                card.appendChild(cuadro);
                card.appendChild(tooltip);
                card.appendChild(nombre);
            }

            grid.appendChild(card);
        }
    </script>

</body>
</html>
